name: goreleaser

on:
  pull_request:
  push:
    tags:
      # Version tags only. This used to be "*", so any stray tag published a
      # release — a leftover tag literally named "push" sat on the remote.
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Run tests
        run: go test ./...
      - name: Run vet
        run: go vet ./...
      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 #v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  goreleaser:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 #v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Homebrew tap formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAP_REPO: youhide/homebrew-youhide
          RELEASE_REPO: ${{ github.repository }}
          PROJECT_NAME: hideTop
          FORMULA_NAME: hidetop
          BINARY_NAME: hidetop
          DESCRIPTION: "A modern terminal-based system monitor written in Go, offering real-time CPU, memory, Apple Silicon GPU metrics, energy impact, and an interactive process list."
          HOMEPAGE: "https://github.com/youhide/hideTop"
          LICENSE: "GPL-3.0"
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/update-tap-formula.sh
